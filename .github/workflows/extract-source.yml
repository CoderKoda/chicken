name: Rebrand Chicken to Bread

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[bread-rebrand]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebrand source tree
        shell: bash
        run: |
          set -euo pipefail

          # Keep the original source archive intact as the upstream reference.
          # Do not modify Git metadata or this workflow while transforming files.
          mapfile -d '' files < <(git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .git/*|chicken-6.0.0.tar.gz|.github/workflows/extract-source.yml) ;;
              *) printf '%s\0' "$f" ;;
            esac
          done)

          # Rename tracked paths containing the project name first.
          for old in "${files[@]}"; do
            new=$(printf '%s' "$old" | sed -e 's/chicken/bread/g' -e 's/Chicken/Bread/g' -e 's/CHICKEN/BREAD/g')
            if [ "$old" != "$new" ]; then
              mkdir -p "$(dirname "$new")"
              git mv -- "$old" "$new"
            fi
          done

          # Replace textual occurrences while preserving binary files.
          while IFS= read -r -d '' file; do
            if grep -Iq . "$file"; then
              perl -0pi -e 's/CHICKEN/BREAD/g; s/Chicken/Bread/g; s/chicken/bread/g' "$file"
            fi
          done < <(git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .git/*|chicken-6.0.0.tar.gz|.github/workflows/extract-source.yml) ;;
              *) printf '%s\0' "$f" ;;
            esac
          done)

          # Update the repository workflow itself in place.
          sed -i \
            -e 's/Extract Chicken source/Rebrand Chicken to Bread/g' \
            -e 's/Chicken 6.0.0/Bread 6.0.0/g' \
            .github/workflows/extract-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand Chicken 6.0.0 as Bread [bread-rebrand]"
          git push

      - name: Remove one-shot workflow marker files
        if: always()
        run: |
          git status --short
